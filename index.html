<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Inside an HPC cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --bg:#E6E9E8;--surface:#F5F6F4;--surface2:#ECEFED;--ink:#18222A;--muted:#56636B;--line:#C3CBCA;
  --cpu:#2D6A8F;--on-cpu:#FFFFFF;--gpu:#E77500;--on-gpu:#1C1104;--access:#7A4FA8;--on-access:#FFFFFF;--infra:#8B969B;--on-infra:#10171C;
  --cold:#D2E4EE;--pcb:#D3DFD6;--tray:#ECE4D2;--chip:#33414A;--chip-ink:#EEF2F2;--dimm:#5A6A73;
  --focus:#1B8A5A;--code:#E1E6E4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181B;--surface:#1C2226;--surface2:#232A2F;--ink:#E5EAEA;--muted:#9AA6AB;--line:#364045;
    --cpu:#5E9FC8;--on-cpu:#0C1820;--gpu:#FF9838;--on-gpu:#1C1104;--access:#B496E3;--on-access:#160C22;--infra:#6E7A80;--on-infra:#0C1114;
    --cold:#1B2D37;--pcb:#1D2924;--tray:#2C281F;--chip:#B9C5CB;--chip-ink:#11181C;--dimm:#7C8B93;
    --focus:#5CD69B;--code:#11161A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181B;--surface:#1C2226;--surface2:#232A2F;--ink:#E5EAEA;--muted:#9AA6AB;--line:#364045;
  --cpu:#5E9FC8;--on-cpu:#0C1820;--gpu:#FF9838;--on-gpu:#1C1104;--access:#B496E3;--on-access:#160C22;--infra:#6E7A80;--on-infra:#0C1114;
  --cold:#1B2D37;--pcb:#1D2924;--tray:#2C281F;--chip:#B9C5CB;--chip-ink:#11181C;--dimm:#7C8B93;
  --focus:#5CD69B;--code:#11161A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5}
.wrap{max-width:1300px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(2.1rem,5.5vw,3.6rem);line-height:.95;font-stretch:70%;font-weight:820;letter-spacing:-.01em;margin:0 0 10px}
.sub{margin:0;color:var(--muted);max-width:60ch}
.focus-ctl{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.focus-ctl button{font:inherit;font-size:.9rem;font-stretch:88%;border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:10px;cursor:pointer}
.focus-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.sw.cpu{background:var(--cpu)}.sw.gpu{background:var(--gpu)}.sw.access{background:var(--access)}.sw.infra{background:var(--infra)}
.steps ol{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.steps li{display:flex;align-items:center;gap:6px}
.steps li+li::before{content:"";width:18px;height:1px;background:var(--line)}
.steps button{font:inherit;font-stretch:85%;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:5px;cursor:pointer}
.steps button[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps button:disabled{opacity:.4;cursor:default}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto;min-height:320px}
.stage svg{display:block;margin:0 auto;height:auto;max-width:100%}
.stage .scroll svg{max-width:none}
.caption{color:var(--muted);font-size:.9rem;text-align:center;margin:10px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 20px 22px}
.panel h2{font-size:1.75rem;line-height:1.1;font-stretch:78%;font-weight:760;margin:0 0 10px}
.panel h3{font-size:1rem;font-weight:700;margin:18px 0 6px}
.panel p{margin:0 0 12px}
.lead{font-size:1.02rem}
.hint{font-weight:650}
.note{color:var(--muted);font-size:.875rem}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 16px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:600}
.panel ul{margin:0 0 12px;padding-left:18px}
.legend{list-style:none;padding:0!important}
.legend li{margin:0 0 6px}
pre{background:var(--code);padding:10px 12px;border-radius:6px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;margin:0 0 12px;white-space:pre-wrap}
.btn{font:inherit;font-weight:680;background:var(--ink);color:var(--surface);border:0;padding:10px 18px;border-radius:6px;cursor:pointer;margin-top:4px}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chips button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:4px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.partinfo{border-top:1px solid var(--line);padding-top:12px}

svg text{font-family:"Archivo",system-ui,sans-serif}
.t{fill:var(--ink)}.tm{fill:var(--muted)}.tc{font-stretch:78%}.tb{font-weight:700}
.k-cpu{fill:var(--cpu)}.k-gpu{fill:var(--gpu)}.k-access{fill:var(--access)}.k-infra{fill:var(--infra)}
.on-cpu{fill:var(--on-cpu)}.on-gpu{fill:var(--on-gpu)}.on-access{fill:var(--on-access)}.on-infra{fill:var(--on-infra)}
.og{fill:var(--on-gpu)}.ci{fill:var(--chip-ink)}
.hit{cursor:pointer;outline:none}
.hb{fill:transparent;stroke:none}
.hit:hover .hb{stroke:var(--ink);stroke-width:1.5}
.hit:focus-visible .hb{stroke:var(--focus);stroke-width:3}
.band-cold{fill:var(--cold)}
.rail{fill:var(--surface2);stroke:var(--line)}
.blank{fill:none;stroke:var(--line);stroke-dasharray:3 3}
.pdu{fill:var(--infra);opacity:.6}
.chassis,.sled{fill:var(--surface2);stroke:var(--line)}
.grille{stroke:var(--line);stroke-width:2}
.bay,.port,.tag{fill:var(--surface);stroke:var(--line)}
.pwr{fill:none;stroke:var(--ink);stroke-width:2}
.led{fill:var(--focus)}
.c-chassis{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.c-pcb{fill:var(--pcb)}
.c-tray{fill:var(--tray);stroke:var(--line);stroke-dasharray:6 4}
.c-io,.c-psu,.c-ghost{fill:var(--surface);stroke:var(--line)}
.c-ghost{stroke-dasharray:5 4}
.c-nic,.c-chip{fill:var(--chip)}
.c-campus{fill:var(--access)}
.c-die{fill:var(--chip-ink);opacity:.12}
.c-dimm,.c-mem{fill:var(--dimm)}
.c-gpu{fill:var(--gpu)}
.c-port{fill:var(--on-gpu);opacity:.55}
.c-bridge{fill:var(--ink)}
.c-fanband{fill:var(--surface)}
.c-fan{fill:none;stroke:var(--muted);stroke-width:2}
.c-bay{fill:var(--surface);stroke:var(--muted)}
.w-nv{stroke:var(--gpu);stroke-width:4;opacity:.7}
.w-pc{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.w-link{fill:none;stroke:var(--chip);stroke-width:4}
.part{cursor:pointer;outline:none}
.part:hover :is(rect,circle,path),.part.active :is(rect,circle,path),.part:focus-visible :is(rect,circle,path){stroke:var(--focus);stroke-width:3;stroke-dasharray:none}
.part .hitpath,.part:hover .hitpath,.part.active .hitpath,.part:focus-visible .hitpath{stroke:transparent;stroke-width:16;fill:none}
[data-focus="cpu"] .stage :is(.dimk-gpu,.dimk-access,.dimk-infra),
[data-focus="gpu"] .stage :is(.dimk-cpu,.dimk-access,.dimk-infra),
[data-focus="access"] .stage :is(.dimk-cpu,.dimk-gpu,.dimk-infra),
[data-focus="infra"] .stage :is(.dimk-cpu,.dimk-gpu,.dimk-access){opacity:.15}
.dimk-cpu,.dimk-gpu,.dimk-access,.dimk-infra{transition:opacity .2s}
.stage.enter>*{animation:open .26s ease-out}
@keyframes open{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage.enter>*{animation:none}.dimk-cpu,.dimk-gpu,.dimk-access,.dimk-infra{transition:none}}
.disclaimer{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--gpu);border-radius:6px;padding:10px 12px;font-size:.9rem;margin:0 0 14px}
.c-numa{fill:var(--cpu);fill-opacity:.07;stroke:var(--cpu);stroke-opacity:.55;stroke-dasharray:4 4}
/* example badge + tooltip */
.ex{position:relative;display:inline-block;vertical-align:1px;margin-left:6px}
.ex-btn{font:inherit;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-stretch:85%;color:var(--muted);background:var(--surface2);border:1px dashed var(--muted);border-radius:999px;padding:1px 8px;cursor:help}
.ex-tip{position:absolute;bottom:calc(100% + 9px);right:-8px;width:min(250px,72vw);background:var(--ink);color:var(--surface);font-size:.82rem;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s,visibility .15s;z-index:5}
.ex-tip::after{content:"";position:absolute;top:100%;right:20px;border:6px solid transparent;border-top-color:var(--ink)}
.ex:hover .ex-tip,.ex-btn:focus-visible+.ex-tip,.ex-btn[aria-expanded="true"]+.ex-tip{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){.ex-tip{transition:none}}
/* entrance doors */
:root{--door:#AFB7BA;--door-hole:#838D92;--door-frame:#8F999D;--door-shadow:rgba(10,15,18,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--door:#2C3438;--door-hole:#161B1E;--door-frame:#454F55;--door-shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--door:#2C3438;--door-hole:#161B1E;--door-frame:#454F55;--door-shadow:rgba(0,0,0,.6)}
body{overflow-x:clip}
.wrap{transform-origin:50% 25%;transition:transform 1.8s cubic-bezier(.2,.7,.2,1),filter 1.4s ease}
.wrap.arrive{transform:scale(1.07);filter:brightness(.65)}
.doors{position:fixed;inset:0;z-index:50;display:flex;perspective:1600px;perspective-origin:50% 45%;cursor:pointer}
.door{position:relative;flex:1;background-color:var(--door);background-image:radial-gradient(circle,var(--door-hole) 1.5px,transparent 2px);background-size:10px 10px;box-shadow:inset 0 0 0 22px var(--door),inset 0 0 0 24px var(--door-frame);backface-visibility:hidden;transition:transform 1.35s cubic-bezier(.55,.05,.25,1),opacity .45s ease .9s}
.door.l{transform-origin:left center;border-right:1px solid var(--door-frame)}
.door.r{transform-origin:right center;border-left:1px solid var(--door-frame)}
.doors.open{pointer-events:none}
.doors.open .door.l{transform:rotateY(100deg);opacity:0}
.doors.open .door.r{transform:rotateY(-100deg);opacity:0}
.handle{position:absolute;top:50%;width:10px;height:150px;margin-top:-75px;border-radius:5px;background:var(--door-frame);box-shadow:0 2px 6px var(--door-shadow)}
.door.l .handle{right:36px}.door.r .handle{left:36px}
.plate{position:absolute;right:72px;top:22%;max-width:calc(100% - 100px);background:var(--surface);color:var(--ink);padding:14px 18px;border-radius:4px;box-shadow:0 2px 8px var(--door-shadow);text-align:right}
.plate-a{display:block;font-stretch:70%;font-weight:820;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1}
.plate-b{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
.reader{position:absolute;left:72px;top:calc(50% - 30px);width:40px;height:60px;border-radius:6px;background:var(--chip);display:grid;place-items:center;box-shadow:0 2px 6px var(--door-shadow)}
.led{width:9px;height:9px;border-radius:50%;background:#D64545;transition:background .2s,box-shadow .2s}
.doors.unlock .led{background:#3BD17A;box-shadow:0 0 10px #3BD17A}
/* the sysadmin: idle, then alarmed, then gone */
.runner{position:absolute;left:0;top:0;z-index:40;pointer-events:none;transform:translateX(var(--rx,12vw))}
.runner.go{animation:dash 2.4s cubic-bezier(.5,0,.75,1) forwards}
@keyframes dash{from{transform:translateX(var(--rx,12vw))}to{transform:translateX(calc(100vw + 60px))}}
.runner svg{display:block;overflow:visible}
.r-bob{animation:breathe 1.4s ease-in-out infinite alternate}
@keyframes breathe{to{transform:translateY(-1.5px)}}
.r-lean{transform-origin:54px 100px;transition:transform .2s ease-out}
.r-lega{transform-origin:54px 98px}
.r-legb{transform-origin:52px 98px}
.r-arma{transform-origin:60px 68px}
.r-armb{transform-origin:48px 68px;transition:transform .15s ease-out}
.r-hair{transform-origin:57px 44px;transition:transform .12s ease-out}
.r-paper{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.p1{transform-origin:13px 67px}.p2{transform-origin:24px 88px}.p3{transform-origin:8px 104px}
.r-sweat{fill:#5FA8D8;stroke:var(--ink);stroke-width:.8}
.r-splash{fill:#7A4A26}
.r-shock{transform-origin:46px 30px}
.r-shock path{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.r-mouth-calm{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.r-bubble{transform-origin:70px 14px}
.r-screen{transition:fill .1s}
.r-mouth,.r-sweat,.r-splash,.r-paper,.r-bubble,.r-shock,.r-err{opacity:0}
.runner:is(.alarm,.go) :is(.r-mouth,.r-err,.r-bubble){opacity:1}
.runner:is(.alarm,.go) .r-mouth-calm{opacity:0}
.runner:is(.alarm,.go) .r-hair{transform:scaleY(1.35)}
.runner:is(.alarm,.go) .r-screen{fill:#D64545}
.runner:is(.alarm,.go) .r-sweat{animation:fling .45s ease-out infinite}
.runner:is(.alarm,.go) .d2{animation-delay:-.22s}
.runner.alarm .r-bob{animation:startle .6s ease-out both}
@keyframes startle{0%{transform:translateY(0)}25%{transform:translateY(-18px)}55%{transform:translateY(0)}72%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.runner.alarm .r-shock{animation:shock .45s ease-out 2 both}
@keyframes shock{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.runner.alarm .r-bubble{animation:pop .25s ease-out .3s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.runner.alarm .r-armb{transform:rotate(-40deg)}
.runner.alarm .r-splash{animation:fling .38s ease-out 2}
.runner.go .r-bob{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.runner.go .r-lean{transform:rotate(10deg)}
.runner.go .r-lega{animation:stride .3s ease-in-out infinite alternate}
.runner.go .r-legb{animation:stride .3s ease-in-out infinite alternate-reverse}
@keyframes stride{from{transform:rotate(-34deg)}to{transform:rotate(34deg)}}
.runner.go .r-arma{animation:pump .3s ease-in-out infinite alternate-reverse}
.runner.go .r-armb{animation:flail .3s ease-in-out infinite alternate}
@keyframes pump{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@keyframes flail{from{transform:rotate(-34deg)}to{transform:rotate(26deg)}}
.runner.go .r-paper{opacity:1;animation:flutter .55s ease-in-out infinite alternate}
.runner.go .p2{animation-delay:-.2s}.runner.go .p3{animation-delay:-.4s}
@keyframes flutter{from{transform:rotate(-25deg)}to{transform:rotate(30deg) translateY(-9px)}}
.runner.go .r-splash{animation:fling .38s ease-out infinite}
.runner.go .s2{animation-delay:-.19s}
@keyframes fling{from{transform:translate(0,0);opacity:1}to{transform:translate(-11px,-7px);opacity:0}}
.runner.go .r-bubble{animation:shake .1s linear infinite alternate}
@keyframes shake{to{transform:translate(.8px,-1.5px)}}
.r-shadow{fill:var(--ink);opacity:.15}
.r-limb{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.r-hoodie{fill:var(--cpu);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.r-lanyard{fill:none;stroke:var(--gpu);stroke-width:1.6}
.r-badge{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.r-head{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.r-hair{fill:var(--ink)}
.r-glass{fill:none;stroke:var(--ink);stroke-width:1.6}
.r-mouth{fill:var(--ink)}
.r-cup{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.r-laptop{fill:var(--chip);stroke:var(--ink);stroke-width:1.2}
.r-screen{fill:#D64545}
.r-err{fill:#FFFFFF;font-weight:800;font-family:"Archivo",system-ui,sans-serif}
.r-bubble rect,.r-bubble path{fill:var(--surface);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.r-bubble text{fill:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-stretch:78%;font-weight:700}
</style>
</head>

<div class="wrap arrive">
  <header>
    <div>
      <h1>Inside an HPC cluster</h1>
      <p class="sub">What the machines behind high-performance computing actually look like, from a row of racks down to a single motherboard. Princeton’s Della cluster is the example throughout. Pick a rack, then a node, then look inside it.</p>
    </div>
    <div class="focus-ctl" role="group" aria-label="Highlight node types">

/* One row, a bit of everything. [type, count, label, host] */
const RACKSPEC = [
  {name:"Front door", items:[["loginCpu",1,"Login node (della)","della"],["loginGpu",1,"GPU login node (della-gpu)","della-gpu"],
    ["vis",1,"Vis node (della-vis1)","della-vis1"],["vis",1,"Vis node (della-vis2)","della-vis2"],

/* ---------- Build ---------- */
const RACKS = {}, NODES = {};
const pad = n => String(n).padStart(2,"0");
const RACKLIST = RACKSPEC.map((spec, i) => {
  const id = "R" + pad(i+1);
  const rack = {id,name:spec.name,items:[],nodes:[]};
  const mk = (item, sled) => {
    const k = rack.nodes.length + 1;
    const node = {id:`${id}-${pad(k)}`,host:item.host || `della-${id.toLowerCase()}-${pad(k)}`,realHost:!!item.host,
      t:item.t,key:item.key,rack,item,sled,label:item.label || item.t.name};
    rack.nodes.push(node); item.nodes.push(node); NODES[node.id] = node;
  };
  let u = 1;
  spec.items.forEach(([key, n, label, host]) => {
    const t = TYPES[key] || INFRA[key];
    if (t.perChassis) {
      let left = n;
      while (left > 0) {
        const k = Math.min(t.perChassis, left); left -= k;
        const item = {key,t,startU:u,u:t.u,nodes:[]};
        for (let s = 0; s < k; s++) mk(item, s);
        rack.items.push(item); u += t.u;
      }
    } else {
      for (let j = 0; j < n; j++) {
        const item = {key,t,startU:u,u:t.u,label,host,nodes:[]};
        mk(item, null); rack.items.push(item); u += t.u;
      }
    }
  });
  rack.compute = rack.nodes.filter(n => n.t.kind === "cpu" || n.t.kind === "gpu");
  RACKS[id] = rack;
  return rack;
});
/* Drawing scale: equipment is 19 in wide and 1U is 1.75 in tall. Racks are drawn just tall enough for their contents (minimum 27U). */
const U_RATIO = 19/1.75;
const RACK_U = Math.max(27, ...RACKLIST.map(r => Math.max(...r.items.map(i => i.startU+i.u-1))));
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const fmt = n => n.toLocaleString("en-US");

  `<g class="hit ${extra}" data-${attr}="${val}" tabindex="0" role="button" aria-label="${label}">${inner}<rect class="hb" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/></g>`;

    inner += txt(x+MW/2, top+MH+18, r.name, "tm tc", 11, "middle");
    s += hit("rack", r.id, `Rack ${r.id}, ${r.name}`, inner, x-4, top-28, MW+8, MH+54);
  });
  s += `<rect class="band-cold" x="${PAD-6}" y="${top+MH+40}" width="${W-2*PAD+12}" height="26" rx="3"/>` +
       txt(W/2, top+MH+57, "Cold aisle: you’re standing here, looking at the fronts of the racks", "tm tc", 11.5, "middle");
  stage.innerHTML = `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:640px" role="group" aria-label="Front view of a row of racks">${s}</svg></div>`;
  const all = Object.values(NODES);
  const count = k => all.filter(x => x.t.kind === k).length;
  panel.innerHTML = `<h2>One row, a bit of everything</h2>
    <p class="lead">An HPC cluster is hundreds of separate computers, called nodes, standing in racks. A fast network and a shared scheduler make them behave like one machine.</p>

/* ---------- Level 1: rack ---------- */
function viewRack(){
  const rack = S.rack;
  const RW=290, UH=(RW-4)/U_RATIO, top=26, X=64, W=440, H = top + RACK_U*UH + 30;
  const yOf = (startU, u) => top + (RACK_U-(startU+u-1))*UH;
  const used = new Set(); rack.items.forEach(it => { for (let k=0; k<it.u; k++) used.add(it.startU+k); });
  let s = `<rect class="rail" x="${X-8}" y="${top-8}" width="${RW+16}" height="${RACK_U*UH+16}" rx="4"/>`;
  for (let u=1; u<=RACK_U; u++) {
    const yy = yOf(u,1);
    s += txt(X-14, yy+UH/2+3.5, u, "tm tc", 10, "end");
    if (!used.has(u)) s += `<rect class="blank" x="${X+2}" y="${yy+1}" width="${RW-4}" height="${UH-2}"/>`;
  }
  s += `<rect class="pdu" x="${X+RW+18}" y="${top}" width="12" height="${RACK_U*UH}" rx="2"/>` +
       txt(X+RW+46, top+RACK_U*UH/2, "Power distribution (PDU)", "tm tc", 11, "middle", `transform="rotate(90 ${X+RW+46} ${top+RACK_U*UH/2})"`);
  rack.items.forEach(it => {
    const y0 = yOf(it.startU, it.u), h = it.u*UH-2, k = it.t.kind;
    if (it.t.perChassis) {
      s += `<rect class="chassis" x="${X+2}" y="${y0+1}" width="${RW-4}" height="${h}" rx="2"/>`;

        const sx = X+4+(i%2)*(sw+2), sy = y0+2+Math.floor(i/2)*(sh+1);
        s += hit("node", n.id, `${n.id}, ${n.t.name}, sled ${i+1}`,
          `<rect class="k-${k}" x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="1.5"/>` + txt(sx+6, sy+sh/2+4, `${n.t.short}, sled ${i+1}`, `on-${k} tc`, 11),
          sx, sy, sw, sh, `dimk-${k}`);
      });
    } else {
      const n = it.nodes[0], fs = 12;
      s += hit("node", n.id, `${n.id}, ${esc(n.label)}`,
        `<rect class="k-${k}" x="${X+2}" y="${y0+1}" width="${RW-4}" height="${h}" rx="2"/>` +
        txt(X+10, y0+h/2+fs/2-0.5, esc(n.label), `on-${k} tc`, fs) + txt(X+RW-10, y0+h/2+fs/2-0.5, `${it.u}U`, `on-${k} tc`, fs, "end"),
        X+2, y0+1, RW-4, h, `dimk-${k}`);
    }
  });
  stage.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" role="group" aria-label="Rack ${rack.id} elevation">${s}</svg>
    <p class="caption">Rack ${rack.id}, front view, drawn to scale. Numbers are rack units (U), counted from the floor.</p>`;
  const groups = [];
  rack.items.slice().sort((a,b) => a.startU-b.startU).forEach(it => {
    const name = it.label || it.t.name, last = groups[groups.length-1];
    if (last && last.name === name) last.c += it.nodes.length; else groups.push({name, c:it.nodes.length, u:it.u, sled:!!it.t.perChassis});
  });
  const free = RACK_U - used.size;
  const extra = rack.items.some(i => i.t.perChassis)
    ? `<p>The older CPU nodes come four to a 2U chassis. Each sled is its own computer; the four only share power supplies and fans.</p>` : "";
  panel.innerHTML = `<h2>Rack ${rack.id}: ${rack.name}</h2>
    <p class="lead">A rack is a steel frame measured in rack units (U): every piece of equipment is 19 inches wide and each U is 1.75 inches tall. Most data-center racks are 42U; these are drawn at ${RACK_U}U because nothing here comes close to filling a full one. Equipment slides in on rails, and power comes from the distribution strips along the side.</p>
    ${extra}
    <h3>In this rack</h3>
    <ul>${groups.map(g => `<li>${g.c} × ${esc(g.name)}${g.sled ? " (sleds)" : ` (${g.u}U each)`}</li>`).join("")}</ul>
    <p>${free} U empty. GPU racks often run half-full: the limit is power and heat, not space.</p>
    <p class="hint">Pick anything in the rack.</p>`;
}

/* ---------- Level 2: node ---------- */
function frontSVG(node){
  const it = node.item, t = node.t, k = t.kind;
  const W = 760, UHP = (W-20)/U_RATIO, h = it.u*UHP, H = h + 24;
  let s = `<rect class="chassis" x="10" y="12" width="${W-20}" height="${h}" rx="4"/>`;
  if (t.perChassis) {
    const sw = (W-36)/2, sh = (h-12)/2;
    it.nodes.forEach((n, i) => {
      const sx = 18+(i%2)*(sw+4), sy = 16+Math.floor(i/2)*(sh+4), sel = n === node;
      s += `<g opacity="${sel ? 1 : .45}"><rect class="${sel ? "k-"+k : "sled"}" x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="2"/>
        <rect class="bay" x="${sx+8}" y="${sy+5}" width="40" height="${sh-10}"/><rect class="bay" x="${sx+52}" y="${sy+5}" width="40" height="${sh-10}"/>
        ${txt(sx+sw-10, sy+sh/2+4, sel ? `Sled ${i+1}: ${n.host}` : `Sled ${i+1}`, sel ? `on-${k} tc` : "tm tc", 12, "end")}</g>`;
    });
  } else {
    s += `<rect class="k-${k}" x="10" y="12" width="10" height="${h}" rx="2"/>`;
    let x = 34;
    if (t.ports) {
      const rows = Math.max(1, Math.min(4, Math.floor((h-12)/16))), cols = 24;
      for (let r=0; r<rows; r++) for (let c=0; c<cols; c++)
        s += `<rect class="port" x="${x+c*21}" y="${18+r*16}" width="17" height="11" rx="1"/>`;
    } else {
      const nd = t.drives || 2, rows = it.u >= 2 ? 2 : 1, cols = Math.ceil(nd/rows);
      const bh = Math.min(30, (h-16)/rows-4), bw = 44;
      for (let i=0; i<nd; i++) {
        const c = i % cols, r = Math.floor(i/cols);
        s += `<rect class="bay" x="${x+c*(bw+6)}" y="${20+r*(bh+6)}" width="${bw}" height="${bh}" rx="2"/>`;
      }
      x += cols*(bw+6) + 14;
      for (let gx = x; gx < 580; gx += 9) s += `<line class="grille" x1="${gx}" y1="20" x2="${gx}" y2="${12+h-8}"/>`;
    }
    const my = 12 + h/2;
    s += `<circle class="pwr" cx="604" cy="${my}" r="8"/><circle class="led" cx="628" cy="${my}" r="3.5"/>
      <rect class="tag" x="644" y="${my-12}" width="98" height="24" rx="2"/>${txt(693, my+4, node.host, "t tc", 11, "middle")}`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Front of ${esc(node.label)}">${s}</svg>`;
}
function viewNode(){
  const n = S.node, t = n.t, it = n.item;

    ` <span class="ex"><button type="button" class="ex-btn" aria-expanded="false" aria-describedby="ex-tip">Example</button><span class="ex-tip" id="ex-tip" role="tooltip">The rack and position are made up for this teaching row. On the real cluster, this node lives somewhere else.</span></span>`;

    ? `<div class="hit" data-go="3" tabindex="0" role="button" aria-label="Look inside this node">${frontSVG(n)}</div>`

    `<p class="caption">Front of the ${t.perChassis ? "chassis, with this sled highlighted" : esc(n.label.toLowerCase().startsWith("vis") ? "vis node" : "unit")}, as you’d see it from the cold aisle, drawn to scale.</p>`;

      <p class="note">No board tour for this one.</p>`;

  }
  const gpuLine = t.gpus ? `${t.gpus} × ${t.gpu}${t.gpuMem ? ", "+t.gpuMem+(t.gpus > 1 ? " each" : "") : ""}` : "None";
  const specs = t.placeholder

function partInfo(p, t){

    bridge:t.form === "pcie8"

    bmc:["BMC","The baseboard management controller: a tiny separate computer on the board. Staff use it to power-cycle the node, read temperatures and open a console over the network, even when the operating system is down."],
    boot:["Boot SSD","A small drive holding the operating system. Your files don’t live here; home, project and scratch directories all arrive over the network."],
    drives:["Front drives","Local NVMe storage, typically exposed to jobs as fast temporary space. Handy for unpacking many small files, but it isn’t shared with other nodes or kept after your job."],
    fans:["Fan wall","Pulls cold-aisle air in the front, across the drives, memory, CPUs and GPUs, and out the back into the hot aisle."],

    module:["GH200 superchip","Instead of a CPU in a socket and a GPU on a PCIe card, Grace Hopper puts both on one module with their memory right beside them. No DIMM slots, no PCIe hop between CPU and GPU."],

    lpddr:["LPDDR5X memory","Low-power memory soldered right beside the CPU instead of in DIMM slots. It can’t be upgraded, but it’s fast and frugal. Up to 480 GB in a typical configuration."],

}
function updatePart(){
  stage.querySelectorAll(".part").forEach(g => g.classList.toggle("active", g.dataset.part === S.part));
  panel.querySelectorAll(".chips button").forEach(b => b.setAttribute("aria-pressed", b.dataset.part === S.part));
  if (S.part) {
    const [title, body] = partInfo(S.part, S.node.t);
    document.getElementById("partInfo").innerHTML = `<h3 style="margin-top:0">${title}</h3><p>${body}</p>`;
  }
}

/* ---------- Navigation ---------- */
function renderSteps(){
  const labels = ["The row", S.rack ? `Rack ${S.rack.id}` : "Rack", S.node ? esc(S.node.realHost ? S.node.host : "Node "+S.node.id) : "Node", "Inside"];
  const avail = [true, !!S.rack, !!S.node, !!S.node && hasBoard(S.node.t)];
  stepsEl.innerHTML = labels.map((l, i) =>
    `<li><button data-go="${i}" ${avail[i] ? "" : "disabled"} ${i === S.level ? 'aria-current="step"' : ""}>${l}</button></li>`).join("");
}
function render(){
  [viewRow, viewRack, viewNode, viewBoard][S.level]();
  renderSteps();
  stage.classList.remove("enter"); void stage.offsetWidth; stage.classList.add("enter");
  if (viaKeyboard) { const f = stage.querySelector(".hit,.part"); if (f) f.focus({preventScroll:true}); }
}
function act(el){
  const d = el.dataset;
  if (d.rack) { S.rack = RACKS[d.rack]; S.node = null; S.level = 1; render(); }
  else if (d.node) { S.node = NODES[d.node]; S.part = null; S.level = 2; render(); }
  else if (d.part) { S.part = d.part; updatePart(); }
  else if (d.go !== undefined) { S.level = +d.go; if (S.level === 3) S.part = null; render(); }
}
const SEL = "[data-rack],[data-node],[data-part],[data-go]";
[stage, panel, stepsEl].forEach(host => {
  host.addEventListener("click", e => { const el = e.target.closest(SEL); if (el && !el.disabled) { viaKeyboard = e.detail === 0; act(el); } });
});
stage.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(SEL);
  if (el) { e.preventDefault(); viaKeyboard = true; act(el); }
});
panel.addEventListener("click", e => {
  const b = e.target.closest(".ex-btn");
  if (b) b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") !== "true");
});
panel.addEventListener("keydown", e => {
  if (e.key === "Escape") panel.querySelectorAll(".ex-btn").forEach(b => { b.setAttribute("aria-expanded", "false"); b.blur(); });
});
document.querySelectorAll(".focus-ctl button").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.focus = b.dataset.focus;
  document.querySelectorAll(".focus-ctl button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
render();

/* ---------- Entrance ---------- */
(function(){
  const doors = document.getElementById("doors"), wrap = document.querySelector(".wrap"), runner = document.getElementById("runner");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { doors.remove(); runner.remove(); wrap.classList.remove("arrive"); return; }
  // Find where the cold aisle will sit once the page settles, so the sysadmin runs along it
  wrap.style.transition = "none"; wrap.classList.remove("arrive");
  const band = stage.querySelector(".band-cold"), br = band ? band.getBoundingClientRect() : null;
  const feet = br ? br.top + br.height*0.75 : innerHeight*0.75;
  wrap.classList.add("arrive"); void wrap.offsetWidth; wrap.style.transition = "";
  runner.style.top = Math.max(0, feet - 142 + scrollY) + "px";
  runner.style.setProperty("--rx", Math.round((br ? br.left + br.width*0.12 : innerWidth*0.15) - 56) + "px");
  runner.addEventListener("animationend", e => { if (e.target === runner) runner.remove(); });
  let started = false;
  const open = () => {
    if (started) return; started = true;
    doors.classList.add("unlock");
    setTimeout(() => { doors.classList.add("open"); wrap.classList.remove("arrive"); }, 380);
    setTimeout(() => runner.classList.add("alarm"), 2400);
    setTimeout(() => { runner.classList.remove("alarm"); runner.classList.add("go"); }, 3300);
    setTimeout(() => doors.remove(), 2000);
  };
  doors.addEventListener("click", open);
  setTimeout(open, 750);
})();
</script>
</body>
</html>
